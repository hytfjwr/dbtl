name: logistics
version: "1.0.0"
config-version: 2
profile: logistics

model-paths: ["models"]
# `data-paths` is the pre-1.0 spelling of `seed-paths` — dbt accepts it with
# a deprecation warning. Declared here (instead of the modern key) so the
# fixture pins the alias end-to-end against real dbt.
data-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# A run hook is part of the project shape: real dbt records it on the
# manifest run, source mode simply never reads it.
on-run-start:
  - "create table if not exists {{ target.schema }}.ops_run_log (hook varchar, ran_at timestamp)"

models:
  logistics:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      # The lowest tag rung: in-file `config(tags=…)` appends on top, the
      # schema entry's `config.tags:` last — the order node.tags keeps.
      +tags: [mart_tree]
    pilot:
      # `vars.yml`'s top-level `vars:` is the only var table this render
      # pass consults — `enable_pilot: true` there turns the folder on.
      +enabled: "{{ var('enable_pilot', false) }}"
    experimental:
      # No vars entry and a `false` default: the whole folder stays off.
      +enabled: "{{ var('enable_experimental', false) }}"
    sandbox:
      # `and`/`not`/`or`/`==` in one project-file `+enabled` render:
      # vars.yml env=dev with lock/force unset-false → ON; `--vars
      # '{env: prod}'` or `lock_sandbox: true` flips the folder OFF.
      +enabled: "{{ var('env', 'dev') == 'dev' and not var('lock_sandbox', false) or var('force_sandbox', false) }}"
    utilities:
      +materialized: table

seeds:
  logistics:
    +tags: [seed_tree]
    shipments:
      # The column type branches on the adapter: the project file's own
      # render evaluates `target.type` (duckdb in the generated fixture).
      +column_types:
        weight_kg: "{{ 'double' if target.type == 'duckdb' else 'numeric' }}"
    shipment_events:
      +column_types:
        event_id: integer

snapshots:
  logistics:
    +tags: [snap_tree]

analyses:
  logistics:
    deep_audit_probe:
      +enabled: "{{ var('probe_enabled', false) }}"

# Exposure tree keys by the exposure fqn (`<pkg>:<yml dirs>:<name>`):
# `+tags` unions with the entry's top-level `tags:` — unless the entry
# declares `config.tags`, which replaces the tree's outright; `+group`
# fills `config.group` when the entry's own `config.group` is absent.
exposures:
  logistics:
    +tags: [exp_tree]
    marts:
      +group: ops_dashboards

# `sources:` is the lowest rung of the source config chain (below the
# schema.yml properties): the `+meta`/`+freshness` here must lose to every
# declaration in models/staging/sources.yml — including a `null` that
# clears it.
sources:
  logistics:
    staging:
      carrier_feed:
        +meta:
          program: tms
        +freshness:
          warn_after: {count: 48, period: hour}
          error_after: {count: 72, period: hour}
