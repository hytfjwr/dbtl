[package]
name = "dbtl"
version.workspace = true
rust-version.workspace = true
edition = "2021"
description = "A terminal UI for exploring dbt model lineage as ASCII art"
license = "MIT"
repository = "https://github.com/hytfjwr/dbtl"
keywords = ["dbt", "tui", "lineage", "terminal", "data"]
categories = ["command-line-utilities", "visualization"]

[lib]
name = "dbtl"
path = "src/lib.rs"

[[bin]]
name = "dbtl"
path = "src/main.rs"

[workspace]
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.5.3"
rust-version = "1.88"
edition = "2021"
license = "MIT"
repository = "https://github.com/hytfjwr/dbtl"

# Shared dependency versions for the workspace members; member crates pin via
# `dep.workspace = true` so a bump in this one table moves the whole tree.
[workspace.dependencies]
anyhow = "1"
# `env` lets --theme default from DBTL_THEME.
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps column definition order from the manifest (its `Map`
# becomes an `IndexMap`), so the structure view shows columns as authored.
serde_json = { version = "1", features = ["preserve_order"] }
# Parses dbt_project.yml + schema.yml for the source loader (no compiled manifest).
# Maintained fork of the deprecated serde_yaml (API-compatible). NOTE: only
# dbtl's OWN config/state files (persist/theme) parse through it — dbt's own
# files go through yaml-rust2's event stream so plain-vs-quoted scalar style
# survives (dbt loads YAML 1.1 via PyYAML: bare `yes` is a bool, `"yes"` isn't).
serde_norway = "0.9"
# Event-level YAML for dbt_project.yml/schema.yml in the source loader: the
# Scalar events carry TScalarStyle, which is the ONLY way to tell a plain
# `yes` (PyYAML: bool) from a quoted `"yes"` (PyYAML: string) — serde_yaml-
# family `Value` types erase that distinction before we can see it.
yaml-rust2 = "0.13"
# Status-bar segment width measurement (src/ui/render.rs) AND the ascii_guard test
# (data cells that are unambiguously WIDE render fine everywhere; only
# ambiguous-width chrome is banned). A normal dependency so `src/` can use it.
unicode-width = "0.2"
# The real SQL parser behind column-level lineage v1 (CLL): dialect-aware
# AST + hand-rolled scope resolution in dbtl-core. Default features — the
# optional `visitor` is NOT required (the resolver walks the AST itself so a
# feature flip can't silently change traversal).
sqlparser = "0.64"
tempfile = "3"

dbtl-core = { path = "crates/core" }
dbtl-tui = { path = "crates/tui" }
dbtl-docs = { path = "crates/docs" }

[dependencies]
dbtl-core.workspace = true
dbtl-tui.workspace = true
dbtl-docs.workspace = true
anyhow.workspace = true
clap.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Temp dbt projects for the symlink-loop regression test (tests/source_fixture.rs).
tempfile.workspace = true
# The benches' synth generator + perf tests share the implementation behind
# `cargo xtask synth` — one deterministic generator, not three copies.
xtask = { path = "xtask" }
unicode-width.workspace = true
# Criterion harness for benches/pipeline.rs (synthetic-manifest pipeline cost).
criterion = "0.5"

[[bench]]
name = "pipeline"
harness = false
