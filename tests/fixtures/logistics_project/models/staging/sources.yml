version: 2

# Source `config:` coverage: dbt resolves a `config:` block as one more
# precedence level ABOVE the same resource's top-level properties
# (tree < source props < source config < table props < table config),
# merges `meta` per key and `freshness` per threshold across all levels,
# unions `tags` (config-channel tags first — source then table — then the
# property-channel tags in the same order), and parks a table whose
# effective `config.enabled` resolves false under `disabled`.
sources:
  - name: carrier_feed
    description: "TMS feed landed by the nightly extract"
    database: raw_tms
    meta: {owner: logistics_it, tier: bronze}
    tags: [nightly]
    loaded_at_field: feed_ts
    freshness:
      warn_after: {count: 12, period: hour}
    config:
      meta: {tier: silver}
      tags: [feed_cfg]
      loaded_at_field: feed_loaded_at
      # warn_after competes with the source's top-level `freshness.warn_after`
      # — pinned against real dbt (config wins for freshness, unlike
      # loaded_at_field where the top-level property wins).
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      # `lane_updates` is consumed by stg_lane_updates; its table-level
      # `config:` beats both its own top-level keys and every source level.
      - name: lane_updates
        description: "Lane-level rate updates"
        tags: [lane_tbl]
        meta: {grain: lane}
        loaded_at_field: lane_prop_ts
        freshness:
          warn_after: {count: 1, period: hour}
          error_after: {count: 2, period: hour}
        config:
          tags: [lane_cfg]
          meta: {tier: gold}
          freshness:
            warn_after: {count: 9, period: hour}
            error_after: {count: 3, period: hour}
      # `config.enabled: false` parks the table — like `+enabled: false` on
      # a model, it never enters the graph (nor do its tests).
      - name: retired_rates
        description: "Superseded rate table"
        config: {enabled: false}
        columns:
          - name: rate_id
            tests:
              - unique
      # A table's top-level `enabled:` is silently ignored by dbt — the
      # table stays in the graph. (Source-level `enabled:` is a dbt parse
      # error and deliberately not exercised.)
      - name: manual_overrides
        enabled: false
        description: "Hand-entered overrides"
        # `config.loaded_at_field` outranks every SOURCE level — the wire
        # value is `mo_cfg_ts` — but would still lose to the table's own
        # top-level `loaded_at_field:` (props beat config within a level
        # for this field, verified).
        config: {loaded_at_field: mo_cfg_ts}
      # `loaded_at_field` resolves PROPERTY-first within each level — the
      # table's top-level value beats its own `config.loaded_at_field`
      # (verified against real dbt). A table-level `freshness: null` clears
      # the inherited value entirely — the walk stops at the explicit null,
      # so the tree `+freshness` never lands here either.
      - name: cleared_field
        loaded_at_field: cleared_prop_ts
        config: {loaded_at_field: cleared_cfg_ts}
        freshness: null
        description: "Append-only feed"
      # `config.loaded_at_field: null` is a NO-OP in dbt (verified on
      # 1.12.6) — it clears nothing, so the source's top-level
      # `loaded_at_field: feed_ts` still lands on the table.
      - name: kept_via_cfg_null
        description: "Inherits the source timestamp through a config null"
        config: {loaded_at_field: null}
      # …while the TABLE's top-level `loaded_at_field: null` is the only
      # clearing spelling: it stops the whole chain, source `config:`
      # included — the wire value is `null`.
      - name: cleared_via_prop
        loaded_at_field: null
        description: "Append-only feed with an explicitly cleared timestamp"
      # `| as_bool` in a table's `config.enabled` — the YAML `{{ }}` render
      # is native, so the filter coerces the string var: vars.yml's
      # "False" parks the table; `--vars '{telematics_flag: "True"}'`
      # coerces to true and revives it.
      - name: gps_pings
        description: "Vehicle telematics ping feed"
        config: {enabled: "{{ var('telematics_flag', 'False') | as_bool }}"}
      # Macro-carried reads — each table below is consumed by exactly one
      # model through a project macro (never a literal `source()` in the
      # model's own SQL), so `unused_sources` must count them as used in
      # both modes.
      - name: ops_events
        description: "Ops-side event feed"
      - name: rate_cards
        description: "Contracted carrier rate cards"
      - name: sensor_pings
        description: "Dock sensor heartbeat pings"
      - name: dock_arrivals
        description: "Dock door arrival feed"
  # Branch-split reads: `stg_order_feed` chooses a table by `target.name` —
  # real dbt records only the rendered arm in `depends_on` (the `dev`
  # profile's `orders`), so `prod_orders` is the "read in prod, absent in
  # the manifest" shape `unused_sources` must not flag. `execute_feed`
  # reads only inside `stg_execute_feed`'s `{% if execute %}` arm — parse
  # renders it away, so the manifest omits the edge while compile still
  # resolves it. `unused_t` is the control: nothing reads it anywhere.
  # `database:` is declared so the wire value is deterministic (an
  # undeclared one comes from the profile).
  - name: raw
    database: raw_ops
    description: "Environment-specific order extracts"
    freshness:
      warn_after: {count: 24, period: hour}
    tables:
      - name: orders
        description: "Dev-environment order extract"
      - name: prod_orders
        description: "Prod-environment order extract"
      - name: execute_feed
        description: "Read only while a model executes (never at parse)"
      - name: unused_t
        description: "Declared but never read"
  # A source-level `config.enabled: false` disables every table that does
  # not re-enable itself — `revived_rates` does, so it stays.
  # `database:` is declared so the value is deterministic: left undeclared
  # dbt fills it from the PROFILE (the same profile-derived difference
  # `NodeDetail.database` documents for models).
  - name: archive
    database: raw_archive
    config: {enabled: false}
    tables:
      - name: legacy_rates
        description: "Rates from the retired system"
      - name: revived_rates
        description: "Still-loaded slice of the archive"
        config: {enabled: true}
