[package]
name = "dbtl-core"
description = "dbtl's dbt domain model — manifest/source parsing, the Dag, diff, and Mermaid export core"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Derives `schemars::JsonSchema` on the `.dbtl.yml` wire structs for
# `cargo xtask gen-docs`; off by default so the `dbtl` binary never links it.
schema = ["dep:schemars"]

[dependencies]
anyhow.workspace = true
regex.workspace = true
# Optional: `--features schema` only.
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
# `.dbtl.yml` is dbtl's OWN config file — serde_norway like the user-level
# config (dbt's own YAML files go through yaml-rust2, see source.rs).
serde_norway.workspace = true
sqlparser.workspace = true
yaml-rust2.workspace = true

[dev-dependencies]
# Temp target/compiled trees for the staleness unit tests (crates/core/src/compiled.rs).
tempfile.workspace = true
