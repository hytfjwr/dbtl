name: Release dry run

# Builds and packages every release target through the same reusable
# pipeline release.yml calls, and renders the demo GIF the same way a real
# release does — under a dummy tag, so nothing is published: no tag is
# created, no GitHub release, no tap update, no attestation (this workflow
# never requests an id-token), and no demo.gif attach (no release-tag is
# passed).
on:
  pull_request:
    paths:
      - ".github/workflows/release*.yml"
      - ".github/workflows/demo.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dry-run:
    name: Release dry run
    uses: ./.github/workflows/release-build.yml
    # Grants the called jobs their requested ceiling — the called workflow's
    # jobs each request `contents: read` (checkout + artifact upload only).
    permissions:
      contents: read
    with:
      tag: v0.0.0-dryrun
      ref: ${{ github.sha }}
      # Dry-run artifacts are inspection-only — keep them short-lived.
      artifact-retention-days: 7

  # Renders the demo GIF through the same reusable workflow a real release
  # calls — without a release-tag, so the attach job is skipped and nothing
  # is published. The write ceiling only exists because GitHub validates a
  # called workflow's declared permissions at startup, skipped jobs
  # included; nothing here ever uses it.
  demo:
    name: Demo GIF
    uses: ./.github/workflows/demo.yml
    permissions:
      contents: write
    with:
      ref: ${{ github.sha }}
