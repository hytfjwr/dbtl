name: sample
version: "1.0.0"
config-version: 2
profile: sample

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

# Directory-hierarchical configs: dbt resolves `+materialized` by path, with
# more specific directories winning. The source loader must honour this tree
# (precedence: in-file config() > schema.yml config > this tree > default view).
# `+meta` merges the same way — per top-level key, deeper paths winning.
models:
  sample:
    +meta:
      team: analytics-eng
    staging:
      # Model-level leaf: `+unique_key` from the tree only lands when neither
      # the .sql `config()` nor schema.yml `config:` declares one — this is
      # the tree-wins case (`stg_two_configs` has no other unique_key).
      stg_two_configs:
        +unique_key: tree_uk
    marts:
      +materialized: table
      +meta:
        domain: finance
      # Loses: fct_line_items declares `config.unique_key` in schema.yml,
      # which sits above the project tree.
      fct_line_items:
        +unique_key: tree_shadowed
      # Governance tree leaf: `+access`/`+group`/`+incremental_strategy` are
      # the tree rung of the in-file > schema.yml > tree > default chain —
      # fct_incr_tree declares none of them elsewhere, so these are what
      # lands (private access is legal because the group is set).
      fct_incr_tree:
        +group: finance
        +access: private
        +incremental_strategy: insert_overwrite
      # fct_incr_schema's schema.yml `config: incremental_strategy: append`
      # must beat this leaf value.
      fct_incr_schema:
        +incremental_strategy: insert_overwrite
    legacy:
      +enabled: false
seeds:
  sample:
    +meta:
      domain: reference
snapshots:
  sample:
    +meta:
      domain: snapshots
# The `sources:` tree keys by the source FQN — <pkg>: <declaring-yml dirs
# (resource-root-relative)>: <source name>: <table name> (verified against
# real dbt: `source.sample.raw.orders` has fqn ['sample','staging','raw',
# 'orders'], and a flat `sources: raw:` key is an *unused config path* — the
# package segment is mandatory). `+meta` here is the lowest precedence: it
# loses per key to the source-level `meta:` AND the table-level `meta:` in
# schema.yml. `raw` and `orders` are separate levels — the source level
# cascades to all its tables, the table level only to that table.
sources:
  sample:
    staging:
      raw:
        +meta:
          tree_src: proj-tree-src
        # These sit BELOW schema.yml in precedence: `raw` declares
        # freshness/loaded_at_field/loader at source level, so none of the
        # tree values may surface on raw's tables.
        +freshness:
          warn_after: {count: 48, period: hour}
        +loaded_at_field: tree_loaded_at
        +loader: tree_loader
        orders:
          +meta:
            tree_tbl: proj-tree-tbl
            # Both of these lose: `shared`/`owner` in schema.yml's source- and
            # table-level `meta:` sit above the tree in precedence.
            shared: "tree-level (shadowed)"
            owner: "tree-level (shadowed)"
      # `archive` declares no ingestion keys in schema.yml — whatever lands
      # on archive.audit_log is exactly what the tree provides.
      archive:
        +freshness:
          warn_after: {count: 48, period: hour}
        +loaded_at_field: archived_at
        +loader: warehouse_cron
  # A bare <source>: <table>: key (no package/dirs) is an unused config path
  # in real dbt — kept here to pin that its meta must NOT land on the source.
  raw:
    customers:
      +meta:
        flat_key: "must-not-land"
