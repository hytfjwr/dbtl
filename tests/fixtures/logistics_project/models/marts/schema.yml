version: 2

models:
  - name: fct_shipments
    description: "Shipment facts with event rollup and order linkage"
    # An entry's top-level `tags:` is a no-op in dbt (verified on 1.12.6)
    # — `config.tags:` is the schema channel that lands, LAST in the
    # `+tags` → in-file → `config.tags:` union.
    tags: [ship_ignored]
    config:
      tags: [ship_yml]
    columns:
      - name: shipment_id
        tests:
          - unique
          - not_null
      - name: weight_kg
        description: "Total weight in kilograms"
        tests:
          - shipkit.no_negative_amounts
      - name: carrier_id
        tests:
          - relationships:
              to: ref('dim_carriers')
              field: carrier_id
  - name: fct_carrier_performance
    description: "{{ doc('carrier_perf_doc') }}"
  - name: dim_carriers
    description: "Carrier dimension"
    columns:
      - name: carrier_id
        tests:
          - unique
          - not_null
  - name: fct_region_gate
    description: "Regional shipment rollup — every region except emea"
    columns:
      - name: order_id
        tests:
          - unique: {config: {enabled: "{{ var('strict_event_check', false) }}"}}
          - not_null
      - name: customer_id
      - name: order_total
  - name: fct_bool_chain
    description: "Event rollup gated on alerts plus the us region"
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: shipment_id
      - name: event_type
      - name: occurred_at
  - name: fct_gate_report
    description: "Carrier rollup whose `enabled` lives in this schema entry"
    config:
      # A Jinja `enabled` at the MODEL's schema `config:` — the whole file
      # must still parse (descriptions, columns, tests) even though the
      # value is a string real dbt renders natively.
      enabled: "{{ var('alerts_enabled') }}"
    columns:
      - name: carrier_id
        tests:
          - unique
          - not_null
      - name: carrier_name
      - name: carrier_rating
  - name: fct_py_delivery_risk
    description: "Late-delivery risk scored off the shipment fact — a python model"
    columns:
      - name: shipment_id
        description: "Shipment the risk row covers"
        tests:
          - unique
          - not_null
      - name: risk_band
        description: "Scored risk band"
  - name: fct_delivery_scores
    description: "SQL consumer of the python delivery-risk model"
    columns:
      - name: shipment_id
        description: "Shipment the score covers"
        tests:
          - unique
          - not_null
      - name: risk_band
        description: "The python model's risk band"
groups:
  - name: ops_dashboards
    owner: {name: ops_team}

exposures:
  # `config.tags` declared: it replaces the `exposures:` tree's `+tags`
  # outright — the wire tags are `config.tags ++ tags:`, sorted. And
  # `config.group` is the ONLY group channel (a top-level `group:` is a
  # dbt parse error, so it can't appear here).
  - name: carrier_ops_dashboard
    type: dashboard
    owner: {name: ops_team, email: ops@example.com}
    tags: [exp_prop]
    config:
      tags: [exp_cfg]
      group: ops_dashboards
    depends_on:
      - ref('fct_shipments')
  # No `config.tags`: the entry's `tags:` unions with the tree `+tags`
  # (`exposures: logistics: +tags`), and `config.group` fills from the
  # `marts:` level's `+group`.
  - name: lane_review
    type: analysis
    owner: {name: ops_team, email: ops@example.com}
    tags: [exp_review]
    depends_on:
      - ref('stg_lane_updates')
      - source('carrier_feed', 'lane_updates')

unit_tests:
  - name: fct_shipments_legs_join
    model: fct_shipments
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_shipment_legs')
        rows:
          - {shipment_id: 1, carrier_id: 10, origin_id: 100, dest_id: 200, weight_kg: 5.0, status: 'delivered', event_count: 2, last_event_at: '2024-01-02'}
          - {shipment_id: 2, carrier_id: 11, origin_id: 101, dest_id: 201, weight_kg: 3.0, status: 'in_transit', event_count: 1, last_event_at: '2024-01-03'}
      - input: ref('int_order_shipments')
        rows:
          - {shipment_id: 1, order_id: 500, order_total: 42.5}
    expect:
      rows:
        - {shipment_id: 1, carrier_id: 10, origin_id: 100, dest_id: 200, weight_kg: 5.0, status: 'delivered', event_count: 2, last_event_at: '2024-01-02', order_id: 500, order_total: 42.5}
        - {shipment_id: 2, carrier_id: 11, origin_id: 101, dest_id: 201, weight_kg: 3.0, status: 'in_transit', event_count: 1, last_event_at: '2024-01-03', order_id: null, order_total: null}
  - name: dim_carriers_row_shape
    model: dim_carriers
    given:
      - input: ref('stg_carriers')
        rows:
          - {carrier_id: 10, carrier_name: 'Acme', mode: 'road', scac_code: 'ACME'}
    expect:
      format: csv
      rows: |
        carrier_id,carrier_name,mode,scac_code
        10,Acme,road,ACME
