version: 2

models:
  - name: stg_shipments
    description: "One row per shipment, typed and renamed from the seed"
    columns:
      - name: shipment_id
        description: "TMS shipment number"
        tests:
          - unique
          - not_null
      - name: carrier_id
        tests:
          - relationships:
              to: ref('stg_carriers')
              field: carrier_id
      - name: status
  - name: stg_carriers
    description: "Carrier dimension staged from seed"
    columns:
      - name: carrier_id
        tests:
          - unique
          - not_null
  - name: stg_facilities
    description: "Warehouse and hub locations"
    columns:
      - name: facility_id
        tests:
          - unique
          - not_null
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
          # Both disabled spellings park the test under `disabled` — it
          # never registers a graph node or inflates the tests:N badge.
          - unique: {enabled: false}
          - not_null: {config: {enabled: false}}
  - name: stg_orders
    columns:
      - name: shipment_id
        tests:
          - relationships:
              to: ref('stg_shipments')
              field: shipment_id
  - name: stg_lane_updates
    description: "Lane rate updates staged from the TMS feed"
    columns:
      - name: lane_id
  # Macro-carried staging models — every body is a single macro call; the
  # schema entry pins docs + key tests the same as a literal-select model.
  - name: stg_ops_events
    description: "Ops event feed staged through a project macro"
    columns:
      - name: feed_id
        description: "Feed row id"
        tests:
          - unique
          - not_null
  - name: stg_rate_cards
    description: "Carrier rate cards staged through a bound-arg macro"
    columns:
      - name: feed_id
        description: "Feed row id"
        tests:
          - unique
          - not_null
  - name: stg_sensor_pings
    description: "Sensor pings staged through a nested macro chain"
    columns:
      - name: feed_id
        description: "Feed row id"
        tests:
          - unique
          - not_null
  - name: stg_dock_arrivals
    description: "Dock arrivals staged through a project-qualified macro"
    columns:
      - name: feed_id
        description: "Feed row id"
        tests:
          - unique
          - not_null
  - name: stg_shipment_events
