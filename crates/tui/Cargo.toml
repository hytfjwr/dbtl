[package]
name = "dbtl-tui"
description = "dbtl's interactive terminal UI — keymap, reducer, and ratatui rendering over dbtl-core"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Derives `schemars::JsonSchema` on `persist::Config` for
# `cargo xtask gen-docs`; off by default so the `dbtl` binary never links it.
schema = ["dep:schemars"]

[dependencies]
dbtl-core.workspace = true
anyhow.workspace = true
ratatui.workspace = true
# Optional: `--features schema` only.
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_norway.workspace = true
unicode-width.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Temp target/compiled trees for the stale-yank test (app/tests.rs).
tempfile.workspace = true
