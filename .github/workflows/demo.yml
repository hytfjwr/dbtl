name: Demo

# Renders demo/demo.tape into demo/demo.gif with vhs. Runs on pull requests
# that touch the tape or the TUI (the GIF lands in the run's `demo-gif`
# artifact, so reviewers can see the screen changes), manually, and as a
# reusable workflow other pipelines can call for the same render.
on:
  pull_request:
    paths:
      - "demo/**"
      - "crates/tui/**"
      - "src/main.rs"
      - ".github/workflows/demo.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out and render (default: the caller's ref)"
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  demo:
    name: Render demo GIF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Reads the shared release-build cache main wrote; never saves —
          # a render-only job would just duplicate the same binaries under
          # a second key.
          shared-key: release
          save-if: false

      - name: Build dbtl
        run: cargo build --release --locked

      - name: Render the demo
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: demo/demo.tape

      - name: Upload the GIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-gif
          path: demo/demo.gif
          retention-days: 14
          if-no-files-found: error

      - name: Point to the artifact in the run summary
        run: |
          BYTES=$(stat -c %s demo/demo.gif)
          {
            echo "### Demo GIF"
            echo
            echo "- artifact: \`demo-gif\` (the Artifacts section of this run, kept 14 days)"
            echo "- size: ${BYTES} bytes"
          } >> "$GITHUB_STEP_SUMMARY"
