version: 2

models:
  - name: fct_orders
    # A docs-block ref (multiline block, models/marts/docs.md): dbt renders it
    # into the description; the source loader must expand it identically.
    description: "{{ doc('order_facts_doc') }}"
    config:
      meta:
        # The in-file `config(meta=…)` `owner` wins over this per key; `zone`
        # survives (schema level beats the project tree, loses to the file).
        owner: schema-writer
        zone: z1
    columns:
      - name: id
        data_tests:
          - not_null
      - name: status
      - name: country_code
      - name: country
  - name: dim_customers
    description: "Customer dimension"
    config:
      # The in-file config (incremental) must win over this schema value.
      materialized: table
      # Loses too: the .sql `config(unique_key=…)` beats schema.yml.
      unique_key: customer_id
      meta:
        owner: bob
  - name: fct_line_items
    description: "Line-item facts, incremental on a composite key"
    config:
      # List-form unique_key; beats the `+unique_key: tree_shadowed` project
      # tree leaf in dbt_project.yml.
      unique_key: [order_id, line_no]
  - name: fct_daily_orders
    description: "Incremental without any unique_key — a lint finding"
  - name: cll_syntax
    description: "CLL v1 coverage: every parser-resolved syntax in one model."
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: status
      - name: status_upper
      - name: country
      - name: jp_id
      - name: rn
      - name: order_id_next

exposures:
  - name: orders_dashboard
    type: dashboard
    url: https://bi.example.com/dashboards/42
    # Mixed text + doc(): the ref expands inside the surrounding sentence.
    description: "Weekly orders overview for finance. {{ doc('finance_note_doc') }}"
    owner:
      name: Finance Team
      email: finance@example.com
    depends_on:
      - ref('fct_orders')
      - ref('agg_country_orders')
  # Minimal shape: owner name only, no url/description; a non-ref dep that
  # must resolve through source().
  - name: churn_notebook
    type: notebook
    owner:
      name: Analytics
    depends_on:
      - ref('dim_customers')
      - source('raw', 'customers')
