name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Classifies the pull request's changed paths into the code/docs/site/
  # docsref scopes; downstream jobs skip themselves on scopes they do not
  # consume. On push and any non-PR event every scope reports true.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
      site: ${{ steps.classify.outputs.site }}
      docsref: ${{ steps.classify.outputs.docsref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff is between the merge commit's two parents — depth 2
          # keeps the base commit reachable.
          fetch-depth: 2

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/changed-paths.sh "$EVENT_NAME" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Own key (clippy artifacts differ from normal builds); saved on pushes to main only.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build-test:
    name: Build & Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Debug info trimmed to line tables — panic backtraces keep line
      # numbers while the shared `test` artifacts shrink. Every job that
      # writes or restores that key exports the same CARGO_* set: the key's
      # env hash folds them in, so the writer and the readers must agree.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Shared per-OS debug/test build; saved on pushes to main only — PR runs and other test jobs restore it.
          shared-key: test
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --workspace --locked --profile ci

      - name: Upload JUnit report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

      # nextest does not run doctests, so they keep their own step.
      - name: Doc tests
        run: cargo test --doc --workspace --locked

  msrv:
    name: MSRV
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version lives in Cargo.toml alone — never repeat it here.
      - name: Read rust-version
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error::rust-version is not set in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Own key — the MSRV toolchain's artifacts are incompatible with stable's; saved on pushes to main only.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check (minimum supported toolchain)
        run: cargo check --workspace --all-targets --locked

  # Runs on every change shape — the spell check covers prose too — but the
  # cargo steps only pay for themselves when code changed.
  hygiene:
    name: Hygiene
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Spell check
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

      - name: Install Rust toolchain
        if: needs.changes.outputs.code != 'false'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        if: needs.changes.outputs.code != 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Own key — rustdoc output differs from normal builds; saved on pushes to main only.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install cargo-machete
        if: needs.changes.outputs.code != 'false'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete

      - name: Unused dependencies
        if: needs.changes.outputs.code != 'false'
        run: cargo machete

      - name: Doc build (warnings are errors)
        if: needs.changes.outputs.code != 'false'
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

      # dbtl-core is the crate a wasm build will link — keep it type-clean
      # for the wasm target even though nothing here links or runs it.
      - name: Check dbtl-core (wasm32)
        if: needs.changes.outputs.code != 'false'
        run: cargo check -p dbtl-core --target wasm32-unknown-unknown --locked

      # dbtl-report is the report-building crate a wasm caller links — same
      # type-clean contract as dbtl-core (no filesystem/terminal deps).
      - name: Check dbtl-report (wasm32)
        if: needs.changes.outputs.code != 'false'
        run: cargo check -p dbtl-report --target wasm32-unknown-unknown --locked

      # dbtl-wasm is the crate the docs site actually compiles to wasm — a
      # wasm32-only dependency or API use must fail here, not in the site
      # build.
      - name: Check dbtl-wasm (wasm32)
        if: needs.changes.outputs.code != 'false'
        run: cargo check -p dbtl-wasm --target wasm32-unknown-unknown --locked

  docs-reference:
    name: Docs reference
    needs: changes
    # The generated surface only drifts from code edits or a docs/ and
    # schema/ edit — other Markdown cannot affect it.
    if: needs.changes.outputs.code != 'false' || needs.changes.outputs.docsref != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Same `test`-key env set as the writer — see Build & Test.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restores the shared debug/test build — it already covers xtask and its dependencies; never saves.
          shared-key: test
          save-if: false

      - name: Generated reference docs are fresh
        run: cargo xtask gen-docs --check --locked

  coverage:
    name: Coverage (report)
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      # No cargo cache: llvm-cov's instrumented artifacts help no other job,
      # and no writer ever saves this key — the restore could never hit.

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov

      - name: Measure coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      # Report only — coverage never gates, it just lands on the run summary.
      - name: Coverage summary
        run: |
          {
            echo '## Coverage (workspace)'
            echo
            echo '| Crate | Lines covered | Coverage |'
            echo '|---|---|---|'
            for pkg in dbtl dbtl-core dbtl-tui dbtl-docs dbtl-report dbtl-wasm xtask; do
              cargo llvm-cov report -p "$pkg" --summary-only --json \
                | jq -r --arg pkg "$pkg" \
                  '(.data[0].totals.lines // {covered:0,count:0,percent:0}) | "| \($pkg) | \(.covered)/\(.count) | \(.percent)%"'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error

  tui-e2e:
    name: TUI E2E (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Same `test`-key env set as the writer — see Build & Test.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        # The PTY suite is Unix-only; Windows gets no job entry at all.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restores the shared per-OS debug/test build covering this suite's targets and dependencies; never saves.
          shared-key: test
          save-if: false

      # nextest does not run #[ignore]d tests, so the PTY suite gets its own
      # explicit cargo-test invocation here.
      - name: TUI PTY end-to-end tests
        run: cargo test --test tui_pty --locked -- --ignored

  # The docs-only path of Build & Test: repository-Markdown edits still run
  # the tests that read that Markdown, on one ubuntu runner, so a prose PR
  # never queues a macOS or Windows leg. A separate job (not a step inside
  # the matrix) is what lets the heavy legs skip outright.
  markdown-tests:
    name: Markdown tests
    needs: changes
    if: needs.changes.outputs.code == 'false' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Same `test`-key env set as the writer — see Build & Test.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restores the shared debug/test build; never saves.
          shared-key: test
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest

      # The suites that read repository Markdown: tests/doc_links.rs and
      # tests/changelog.rs plus dbtl-tui's README-keybindings unit test.
      - name: Tests that read repository Markdown
        run: |
          cargo nextest run --locked --profile ci -p dbtl --test doc_links --test changelog
          cargo nextest run --locked --profile ci -p dbtl-tui -E 'test(readme_keybindings_resolve_against_bindings)'

  # Housekeeping, never a gate: once this workflow's writers have saved
  # their fresh generations on a main push, drop every older generation of
  # the same series so the Actions cache stays inside its budget. Readers
  # restore the newest entry, so pruning cannot break a later restore.
  cache-prune:
    name: Prune old cache generations
    needs:
      - changes
      - lint
      - build-test
      - msrv
      - hygiene
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Deleting cache entries needs the actions scope.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prune old generations of this workflow's caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prune-caches.sh v0-rust-test- v0-rust-lint- v0-rust-msrv- v0-rust-hygiene-

  # The single required check for this workflow: fails when any needed job
  # failed or was cancelled; change-scoped skips pass.
  ci-result:
    name: CI result
    needs:
      - changes
      - lint
      - build-test
      - msrv
      - hygiene
      - docs-reference
      - markdown-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Aggregate the required checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash .github/scripts/aggregate-results.sh
