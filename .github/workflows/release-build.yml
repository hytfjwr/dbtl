name: Release build

# Reusable build + package pipeline shared by release.yml (real releases)
# and release-dry-run.yml (pull requests) — the dry run exercises the exact
# steps a real release takes. Publishing-related steps (tag resolution,
# attestation, the GitHub release, the Homebrew tap) live in the callers.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag stamped into artifact names (dbtl-<tag>-<target>)
        required: true
        type: string
      ref:
        description: Git ref to check out and build
        required: true
        type: string

permissions: {}

jobs:
  # Completion scripts and the man page are target-independent text. They are
  # generated once on a native build — cross-compiled binaries are never run.
  dist-files:
    name: Completions and man page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate completions and the man page
        run: |
          cargo build --release --locked
          mkdir -p dist/completions dist/man
          target/release/dbtl completions bash > dist/completions/dbtl.bash
          target/release/dbtl completions zsh > dist/completions/_dbtl
          target/release/dbtl completions fish > dist/completions/dbtl.fish
          target/release/dbtl man > dist/man/dbtl.1

      - name: Upload generated files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-files
          path: dist
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    needs: dist-files
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
            musl: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            archive: tar.gz
            musl: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # psm's build script compiles a C file, and musl binaries must link
      # against musl libc — musl-gcc serves both (the cc-rs fallback search
      # finds it as the musl C compiler; CARGO_TARGET_*_LINKER makes rustc
      # link the final binary with it instead of the glibc gcc).
      - name: Install musl-tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          # Ignored by non-musl targets; on musl they force musl-gcc for
          # both the psm build script and the final binary link.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target "$TARGET"

      # A musl artifact must be fully static — prove it inside the job with
      # the binary itself (ldd + a real run) rather than trusting the target
      # name.
      - name: Verify the musl binary
        if: matrix.musl
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/${TARGET}/release/dbtl"
          file "$bin"
          if ! ldd "$bin" 2>&1 | grep -q "not a dynamic executable"; then
            echo "::error::$bin is not statically linked:"
            ldd "$bin" || true
            exit 1
          fi
          "$bin" --version
          "$bin" check --manifest tests/fixtures/manifest.json

      - name: Download completions and man page
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-files

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag }}
        run: |
          staging="dbtl-${TAG}-${TARGET}"
          mkdir "$staging"
          install -m 755 "target/${TARGET}/release/dbtl" "$staging/dbtl"
          cp LICENSE README.md "$staging/"
          cp -r completions man "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag }}
        run: |
          $staging = "dbtl-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/$env:TARGET/release/dbtl.exe" "$staging/dbtl.exe"
          Copy-Item LICENSE, README.md $staging
          Copy-Item -Recurse completions, man $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbtl-${{ matrix.target }}
          path: "dbtl-*.${{ matrix.archive }}"
          retention-days: 7
          if-no-files-found: error

  # One job assembles the publishable set — the checksums and the SBOM come
  # out of the same steps whether the caller is a dry run or a real release.
  package:
    name: Package release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dbtl-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum dbtl-*.tar.gz dbtl-*.zip > checksums.txt
          cat checksums.txt

      # The SBOM describes the shipped binary's dependency set: normal deps
      # only (dev-deps excluded), over every target platform (--target all
      # covers the per-platform crates that any single --target would miss).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate the CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target all
          mv dbtl_bin.cdx.json "dist/dbtl-${TAG}.cdx.json"

      - name: Summarize artifacts
        run: |
          {
            echo '## Release artifacts'
            echo
            echo '| File | Size |'
            echo '|---|---|'
            (cd dist && for f in *; do
              printf '| %s | %s bytes |\n' "$f" "$(stat -c %s "$f")"
            done)
            echo
            echo '### checksums.txt'
            echo '```'
            cat dist/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release asset bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist
          retention-days: 7
          if-no-files-found: error
