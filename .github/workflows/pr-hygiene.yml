name: PR hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PR hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      # Pull-request text arrives via env vars only — it is never expanded
      # inside the script, so body text cannot inject shell.
      - name: Check title and body
        run: |
          status=0

          # Titles are conventional-commit subjects.
          conventional='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert|release|style)(\([a-z0-9._/-]+\))?!?: .+'
          if ! grep -Eq "$conventional" <<<"$PR_TITLE"; then
            echo "::error::title is not a conventional commit: '$PR_TITLE'"
            status=1
          fi

          # Dependabot bodies repost third-party changelogs the checks below
          # can never accept; the title is still held to the same bar.
          if [[ "$HEAD_REF" == dependabot/* ]]; then
            text="$PR_TITLE"
          else
            text="$PR_TITLE"$'\n'"$PR_BODY"
          fi

          # Forbidden-pattern literals are split with a leading character class
          # so this file can never match what it bans.
          out=$(printf '%s\n' "$text" | perl -CSD -ne '
            my @why;
            push @why, "attribution"
              if /[c]o-authored-by\s*:|[g]enerated\s+(with|by)\b|\b[d]evin\b|[c]ognition\.ai/i;
            push @why, "local-planning-ref"
              if m{[p]roposals/|[D]ECISIONS-LOG|[O]RCHESTRAT|[W]ORKER-PROMPT|[s]creen-spec|[C]LAUDE\.md|[A]GENTS\.md|\x{00A7}\s?\d|\b[I]ssue\s?\d{1,2}\b|\b[i]ssue\d{2}\b}i;
            push @why, "non-English"
              if /[\p{Han}\p{Hiragana}\p{Katakana}\x{3000}-\x{303F}\x{FF00}-\x{FFEF}]/;
            if (@why) {
              chomp;
              my $s = length($_) > 160 ? substr($_, 0, 160) . "..." : $_;
              print "[" . join(",", @why) . "] line $.: $s\n";
            }
          ')
          if [ -n "$out" ]; then
            echo "::error::PR title/body failed hygiene checks:"
            printf '%s\n' "$out"
            status=1
          fi

          exit "$status"
