name: Security

on:
  push:
    branches: [main]
  pull_request:
  # New RustSec advisories appear without any commit; scan the lockfile daily
  # so they surface even while the tree is unchanged.
  schedule:
    - cron: "23 21 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Kept out of `checks`: its SARIF upload needs `security-events: write` and
  # `actions: read`, which would widen the token every other check (pinact
  # included) runs with.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    permissions:
      contents: read
      # zizmor-action uploads SARIF results to the Security tab.
      security-events: write
      # Required by codeql-action/upload-sarif inside zizmor-action.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version:` input: the action resolves `latest` from a hash-locked
      # requirements file in its own tree, so the SHA pin also pins zizmor
      # (1.32.0 at v0.8.1) and a Dependabot update moves both.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Fork PRs get a read-only token (no security-events: write), so the
          # SARIF upload would always fail there; fall back to plain output.
          advanced-security: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  # The four small, independent checks share one job: each is a few seconds of
  # work, so separate jobs mostly paid runner start-up and checkout. The
  # steps run in order and each one runs even when an earlier check failed
  # (`!cancelled()`), so a single run reports every finding. Every tool comes
  # from an action pinned by SHA, so Dependabot moves the tool's version with
  # the pin. They are not `parallel:` steps — concurrent `uses:` steps race
  # in the runner (shared action downloads, composite-action state, the
  # event payload file).
  checks:
    name: Security checks
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No version given: the install-action pin decides it (0.11.0 at this
      # pin), and the download is verified against the checksum in its
      # manifest. jactionlint lints workflow `run:` bodies through the
      # `shellcheck` it finds on PATH, and the script lint runs it directly,
      # so both use this one install — it comes before both.
      - name: Install shellcheck
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: shellcheck

      - name: Lint shell scripts
        run: bash .github/scripts/run-shellcheck.sh

      # jactionlint rather than rhysd/actionlint: actionlint reports parallel
      # and background steps as syntax errors. The SHA pin also pins the
      # release the action downloads, and findings land as pull request
      # annotations.
      - name: Lint workflows
        if: ${{ !cancelled() }}
        uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0

      # `fix: false` is `pinact run --check` (the default would try to push a
      # fix); `verify` also checks each pinned SHA matches its trailing
      # version comment (catches a lying `# vX.Y.Z` next to a malicious SHA).
      - name: Verify all actions are SHA-pinned
        if: ${{ !cancelled() }}
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          fix: "false"
          verify: "true"

      # Advisory state moves independently of the code, so bans/licenses/
      # sources stay on push + pull_request only (never a manual run);
      # advisories run on every trigger in their own job below. The action's
      # image carries cargo-deny; `arguments` is emptied because its default
      # (`--all-features`) is not what the workspace has been checked with.
      - name: Check bans, licenses, and sources
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: ""
          command-arguments: bans licenses sources

  # Kept out of `checks` and out of the aggregate: report-only, and it runs
  # on the daily schedule too, which `checks` skips.
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check security advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: ""
          command-arguments: advisories

  # The single required check for this workflow: fails when any needed job
  # failed or was cancelled. `advisories` stays out of `needs` — new
  # advisories appear without any commit and must not gate merges. On a
  # schedule or dispatch run the trigger-scoped skips simply pass.
  security-result:
    name: Security result
    needs:
      - zizmor
      - checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Aggregate the required checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash .github/scripts/aggregate-results.sh
