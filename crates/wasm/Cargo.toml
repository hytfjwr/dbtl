[package]
name = "dbtl-wasm"
description = "dbtl's engine as an in-memory API plus WebAssembly bindings — the same selector, lineage, lint, and column-lineage output the CLI produces"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# `cdylib` is what wasm-bindgen post-processes into the browser artifact;
# `rlib` lets native callers (the parity tests, the site build's Node check)
# link the same engine.
crate-type = ["cdylib", "rlib"]

[dependencies]
dbtl-core.workspace = true
dbtl-report.workspace = true
serde.workspace = true
serde_json.workspace = true
# Pinned exactly on purpose: the wasm-bindgen CLI that post-processes the
# .wasm must match the crate's schema version, so the two are only ever
# upgraded together (see CONTRIBUTING.md).
wasm-bindgen = "=0.2.129"
