name: Demo

# Renders demo/demo.tape into demo/demo.gif with vhs. Runs on pull requests
# that touch the tape or the TUI (the GIF lands in the run's `demo-gif`
# artifact, so reviewers can see the screen changes), manually, and as a
# reusable workflow other pipelines can call for the same render. When a
# `release-tag` input is set, a second job attaches the GIF to that tag's
# published release — how each release gets its `demo.gif` asset.
on:
  pull_request:
    paths:
      - "demo/**"
      - "crates/tui/**"
      - "src/main.rs"
      - ".github/workflows/demo.yml"
  workflow_dispatch:
    inputs:
      release-tag:
        description: >-
          Published release tag (vX.Y.Z) to attach the rendered GIF to. The
          GIF is rendered from the ref you run the workflow on, so this can
          add or refresh demo.gif on a release that is already out. Leave
          empty to only produce the `demo-gif` run artifact.
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out and render (default: the caller's ref)"
        required: false
        type: string
      release-tag:
        description: >-
          Published release tag (vX.Y.Z) to attach the rendered GIF to.
          Leave empty to only produce the `demo-gif` run artifact.
        required: false
        type: string

permissions: {}

concurrency:
  # Inside a workflow_call, github.workflow resolves to the caller's name —
  # so an unprefixed group would land the called jobs in the caller's own
  # concurrency group, which GitHub reports as a deadlock and cancels. The
  # demo- prefix keeps this workflow's renders grouped per caller and ref
  # while never colliding with a calling workflow's group.
  group: demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  demo:
    name: Render demo GIF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Reads the shared release-build cache main wrote; never saves —
          # a render-only job would just duplicate the same binaries under
          # a second key.
          shared-key: release
          save-if: false

      - name: Build dbtl
        run: cargo build --release --locked

      - name: Render the demo
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: demo/demo.tape

      - name: Upload the GIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-gif
          path: demo/demo.gif
          retention-days: 14
          if-no-files-found: error

      - name: Point to the artifact in the run summary
        run: |
          BYTES=$(stat -c %s demo/demo.gif)
          {
            echo "### Demo GIF"
            echo
            echo "- artifact: \`demo-gif\` (the Artifacts section of this run, kept 14 days)"
            echo "- size: ${BYTES} bytes"
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs only when the caller (or a manual run) names a published release —
  # skipped on pull requests and on tag-less calls, so a dry run exercises
  # the render without ever touching a release.
  attach:
    name: Attach demo GIF
    needs: demo
    if: ${{ inputs.release-tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # gh release upload onto an existing release.
      contents: write
    steps:
      - name: Download the rendered GIF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-gif
          path: dist

      # Uploads to a release that already exists — never creates one. A bad
      # tag shape or a missing release fails before anything is written.
      - name: Verify the tag and its release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release-tag '$TAG' is not a vX.Y.Z release tag."
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No release found for $TAG. The demo GIF only attaches to a release that already exists."
            exit 1
          fi

      - name: Upload demo.gif to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: gh release upload "$TAG" dist/demo.gif --clobber --repo "$GITHUB_REPOSITORY"
