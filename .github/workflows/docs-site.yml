name: Docs site

# The site is published only for a release.
#   - Pull requests build the site to check it; nothing is deployed.
#   - After a release is published, release.yml starts this workflow from main
#     with the release tag as `ref`. It builds the site from that tag and
#     deploys it (GitHub Pages accepts deployments from main only).
#   - To publish again by hand, run this workflow on main from the Actions tab.
#     Set `ref` to a release tag, or leave it empty for the latest release.
#     Run from any other branch, it builds without deploying.
on:
  pull_request:
    paths:
      - "site/**"
      - "docs/reference/**"
      - "CHANGELOG.md"
      - "tests/fixtures/manifest.json"
      - "tests/fixtures/sample_manifest.json"
      - "Cargo.toml"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to build and deploy (default: the latest release)"
        type: string
        required: false

permissions: {}

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Resolve release tag
        id: tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          tag="$INPUT_REF"
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a release tag (expected vX.Y.Z)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tag on a manual run; the default ref on a pull request.
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # The version comes from the packageManager field.
          package_json_file: site/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          # No package cache: the install is small, and a restored cache could
          # outlive a compromised release.
          package-manager-cache: false

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Format check
        working-directory: site
        run: pnpm run format:check

      - name: Lint
        working-directory: site
        run: pnpm run lint

      - name: Build (includes the search index and the link check)
        working-directory: site
        run: pnpm run build

      - name: Type check
        working-directory: site
        run: pnpm run check

      - name: Install the test browser
        if: github.event_name == 'pull_request'
        working-directory: site
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        if: github.event_name == 'pull_request'
        working-directory: site
        run: pnpm run test:e2e

      - name: Upload browser-test screenshots
        if: github.event_name == 'pull_request' && failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-screenshots
          path: site/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload site
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy docs site
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the uploaded artifact to GitHub Pages
      id-token: write # deploy-pages verifies the deployment origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
