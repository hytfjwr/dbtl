name: Perf

on:
  pull_request:
    paths:
      - "crates/**"
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "xtask/**"
      # The workflow's own changes exercise `Perf (report)` on the PR.
      - ".github/workflows/perf.yml"
  push:
    branches: [main]
    paths:
      # Same set as pull_request — the prebuild job warms whatever the
      # report job measures.
      - "crates/**"
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "xtask/**"
      - ".github/workflows/perf.yml"
  # Daily — release-mode perf tests plus the ignored `perf_*` suite.
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Build-affecting paths: the trigger list minus this workflow file —
  # keep it in sync with the paths above. The prebuilt-binaries key
  # derives from the last commit that touched them, so commits that
  # cannot change the binaries keep the same key.
  PERF_INPUT_PATHS: crates src benches Cargo.toml Cargo.lock xtask

jobs:
  # Report-only base-vs-head comparison: short Criterion runs on both sides
  # plus command timings on a generated 10k-model project. Regressions never
  # fail the job — they show up as a `**slower**` flag in the step summary —
  # and a failed measurement renders `n/a`, so the only red is a broken
  # workflow definition itself.
  perf-report:
    name: Perf (report)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # WORK is one scratch root for everything the job produces: the base
      # worktree or restored binaries, both criterion output dirs, the
      # synth project, and the metrics files the report renderer reads.
      - name: Prepare the scratch dir
        run: mkdir -p "$RUNNER_TEMP/perf" && echo "WORK=$RUNNER_TEMP/perf" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge-base lookup needs the base branch's history.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Shares the cache `Perf (prebuild)` writes, so the head build
          # pays only for what this PR changed. Saving is that job's alone.
          shared-key: perf
          save-if: false

      - name: Resolve the merge base
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The base object can be missing from the fetched history — pull
          # it explicitly first (anonymous fetch works; the repo is public).
          git fetch origin "$BASE_SHA" || true
          if sha=$(git merge-base HEAD "$BASE_SHA" 2>/dev/null); then
            echo "merge-base: $sha"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            # Unresolvable base: every base-side step is skipped and the
            # report renders that side n/a — never measure the wrong base.
            echo "merge-base: unresolvable — base-side rows will be n/a"
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      # `Perf (prebuild)` publishes the binaries `Perf (report)` would
      # otherwise compile for its base side on every PR: the release `dbtl`
      # plus the compiled Criterion harness. The key derives from the
      # toolchain and the last build-affecting commit at the merge base, so
      # binaries never stand in for a different base — a miss falls back to
      # building the merge base in a worktree exactly as before. Measured
      # numbers are never cached: both sides always run on this runner.
      - name: Resolve the prebuilt-base key
        id: base-key
        if: steps.base.outputs.sha != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          # Same derivation `Perf (prebuild)` saves under — keep them in sync.
          read -ra paths <<< "$PERF_INPUT_PATHS"
          input_sha=$(git log -1 --format=%H "$BASE_SHA" -- "${paths[@]}")
          toolchain_hash=$(rustc -V | sha256sum | cut -c1-16)
          echo "input-sha=$input_sha" >> "$GITHUB_OUTPUT"
          echo "key=perf-bin-${RUNNER_OS}-${toolchain_hash}-${input_sha:-none}" >> "$GITHUB_OUTPUT"

      - name: Restore the prebuilt base binaries
        id: prebuilt
        if: steps.base.outputs.sha != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/perf/prebuilt
          key: ${{ steps.base-key.outputs.key }}

      - name: Verify and classify the base source
        id: base-bin
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          INPUT_SHA: ${{ steps.base-key.outputs.input-sha }}
          CACHE_HIT: ${{ steps.prebuilt.outputs.cache-hit }}
        run: |
          mode=build
          if [ -z "$BASE_SHA" ]; then
            mode=none
          elif [ "$CACHE_HIT" = "true" ] \
            && [ -x "$WORK/prebuilt/dbtl" ] \
            && [ -x "$WORK/prebuilt/pipeline" ] \
            && "$WORK/prebuilt/dbtl" --version >/dev/null 2>&1 \
            && "$WORK/prebuilt/pipeline" --bench --list >/dev/null 2>&1; then
            # Restored bits must actually run before they may stand in for
            # the base — a broken restore falls back to the in-job build.
            mode=prebuilt
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          case "$mode" in
            prebuilt) echo "base: prebuilt binaries for ${INPUT_SHA:0:7}" ;;
            build)    echo "base: built in this job" ;;
            none)     echo "base: n/a (merge base unresolved)" ;;
          esac >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the base in a worktree
        if: steps.base-bin.outputs.mode == 'build'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: git worktree add "$WORK/base" "$BASE_SHA"

      - name: Detect benchmark-set changes
        id: flags
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          # A delta measured across a changed benchmark set is part code,
          # part measurement — the report notes it. An unresolvable base
          # counts as changed (the conservative note).
          changed=true
          if [ -n "$BASE_SHA" ] && git diff --quiet "$BASE_SHA" HEAD -- benches xtask; then
            changed=false
          fi
          echo "benches-changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Build head (release)
        run: |
          # The restored cargo cache can hold a stale release binary — drop
          # both binaries first so a failed build can never masquerade as
          # a measured head.
          rm -f target/release/dbtl target/release/xtask
          cargo build --release --locked -p dbtl -p xtask || true

      - name: Build base (release)
        if: steps.base-bin.outputs.mode == 'build'
        run: |
          cd "$WORK/base"
          cargo build --release --locked || true

      # `|| true` everywhere below: a failed measurement must not fail the
      # job — the renderer writes n/a for whatever is missing.
      - name: Benchmark head
        env:
          CRITERION_HOME: ${{ runner.temp }}/perf/criterion-head
        run: cargo bench --locked --bench pipeline -- --measurement-time 2 --warm-up-time 1 --sample-size 10 || true

      - name: Benchmark base (prebuilt)
        if: steps.base-bin.outputs.mode == 'prebuilt'
        env:
          CRITERION_HOME: ${{ runner.temp }}/perf/criterion-base
          BASE_BIN: ${{ runner.temp }}/perf/prebuilt
        run: |
          "$BASE_BIN/pipeline" --bench --measurement-time 2 --warm-up-time 1 --sample-size 10 || true

      - name: Benchmark base
        if: steps.base-bin.outputs.mode == 'build'
        env:
          CRITERION_HOME: ${{ runner.temp }}/perf/criterion-base
        run: |
          cd "$WORK/base"
          cargo bench --locked --bench pipeline -- --measurement-time 2 --warm-up-time 1 --sample-size 10 || true

      - name: Generate the synthetic project (10,000 models)
        run: ./target/release/xtask synth --models 10000 --out "$WORK/synth" || true

      # GNU time writes "elapsed_secs max_rss_kib"; the recorded exit code
      # distinguishes a gate finding (exit 1 — still a valid measurement)
      # from an unusable run (≥2 → n/a).
      - name: Measure check/docs and binary sizes
        env:
          BASE_MODE: ${{ steps.base-bin.outputs.mode }}
        run: |
          mkdir -p "$WORK/metrics"
          measure() {
            name="$1"; side="$2"; bin="$3"; shift 3
            if /usr/bin/time -f "%e %M" -o "$WORK/metrics/$name.$side.time" "$bin" "$@" >/dev/null 2>&1; then
              code=0
            else
              code=$?
            fi
            if [ -f "$WORK/metrics/$name.$side.time" ]; then
              # GNU time prepends a "Command exited with non-zero status N"
              # notice ahead of the format line on gate findings — take the
              # LAST line and require the numeric "secs rss" shape so a
              # stray notice can never become a fake measurement.
              last=$(tail -n 1 "$WORK/metrics/$name.$side.time" 2>/dev/null || true)
              if [[ "$last" =~ ^([0-9.]+)[[:space:]]+([0-9]+) ]]; then
                printf '%s %s %s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "$code" > "$WORK/metrics/$name.$side"
              fi
            fi
          }
          base_bin="$WORK/base/target/release/dbtl"
          if [ "$BASE_MODE" = "prebuilt" ]; then
            base_bin="$WORK/prebuilt/dbtl"
          fi
          head_bin="$GITHUB_WORKSPACE/target/release/dbtl"
          if [ -x "$base_bin" ]; then
            measure check base "$base_bin" check --project "$WORK/synth" --lint --quiet
            measure docs  base "$base_bin" docs --project "$WORK/synth" --out "$WORK/docs-base" --quiet
            stat -c %s "$base_bin" > "$WORK/metrics/size.base"
          fi
          if [ -x "$head_bin" ]; then
            measure check head "$head_bin" check --project "$WORK/synth" --lint --quiet
            measure docs  head "$head_bin" docs --project "$WORK/synth" --out "$WORK/docs-head" --quiet
            stat -c %s "$head_bin" > "$WORK/metrics/size.head"
          fi
          ls -la "$WORK/metrics" || true

      - name: Render the perf report
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED: ${{ steps.flags.outputs.benches-changed }}
        run: |
          flags=()
          if [ "$CHANGED" = "true" ]; then
            flags+=(--benches-changed)
          fi
          xtask="$GITHUB_WORKSPACE/target/release/xtask"
          # `${var:+...}` keeps the label bare "base" when the merge base
          # could not be resolved (base-side cells then render n/a).
          base_label="base${BASE_SHA:+-${BASE_SHA:0:7}}"
          rendered=false
          if [ -x "$xtask" ] \
            && "$xtask" perf-report \
              --base "$WORK/criterion-base" \
              --head "$WORK/criterion-head" \
              --metrics-dir "$WORK/metrics" \
              --base-label "$base_label" \
              --head-label "head-${HEAD_SHA:0:7}" \
              --out "$WORK/report.md" \
              "${flags[@]}" \
            && [ -f "$WORK/report.md" ]; then
            cat "$WORK/report.md" >> "$GITHUB_STEP_SUMMARY"
            cat "$WORK/report.md"
            rendered=true
          fi
          if [ "$rendered" != "true" ]; then
            # A missing binary or a failed render is a measurement failure,
            # not a workflow failure — say so on the summary, stay green.
            {
              echo '## Perf report'
              echo
              echo 'Report rendering or the head build failed — measurements unavailable.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-report-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/perf/report.md
            ${{ runner.temp }}/perf/metrics
          if-no-files-found: ignore
          retention-days: 30

  # Mirrors the rendered report into one sticky pull request comment
  # (`<!-- dbtl:perf-report -->`, updated on every push) so reviewers see
  # the tables without opening the run. Same-repo pull requests only —
  # forked ones get a read-only token and keep the step summary. The
  # measuring job builds and runs pull request code, so the write
  # permission lives here instead of there; like the measurement steps,
  # every failure degrades to a warning and never turns the job red.
  perf-comment:
    name: Perf (comment)
    needs: perf-report
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A failed `Perf (report)` can leave no artifact behind, so the
      # download is allowed to fail — the step below treats a missing
      # report as an unmeasurable run.
      - name: Download the report artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: perf-report-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/perf-report

      - name: Post or update the sticky comment
        env:
          DBTL_PR_NUMBER: ${{ github.event.pull_request.number }}
          DBTL_COMMENT_MARKER: "<!-- dbtl:perf-report -->"
          ARTIFACT_DIR: ${{ runner.temp }}/perf-report
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/perf-comment-body.md"
          update_only=false
          if [ -f "$ARTIFACT_DIR/report.md" ]; then
            {
              printf '%s\n\n' "$DBTL_COMMENT_MARKER"
              cat "$ARTIFACT_DIR/report.md"
              printf '\n_Measured by the [Perf (report)](%s) run._\n' "$RUN_URL"
            } >"$body"
          else
            # No report on this run: never create a comment, but rewrite an
            # existing one so it cannot keep showing stale numbers.
            {
              printf '%s\n\n' "$DBTL_COMMENT_MARKER"
              echo '**Perf report unavailable** — this run did not produce measurements.'
              printf '\n_See the [Perf (report)](%s) run._\n' "$RUN_URL"
            } >"$body"
            update_only=true
          fi
          DBTL_REPORT="$body" DBTL_COMMENT_UPDATE_ONLY="$update_only" \
            bash "$GITHUB_WORKSPACE/action/comment.sh"

  # Compiles the binaries `Perf (report)` needs for its base side — the
  # release `dbtl` and the Criterion harness — and stores them under the
  # key the report job derives from its merge base. A restore hit means the
  # same inputs were already built, so the job exits without rebuilding;
  # this keeps non-code pushes cheap even when the path filter lets them
  # through. The binaries are keyed by toolchain plus the last commit that
  # touched the build-affecting paths, never by measured output.
  perf-prebuild:
    name: Perf (prebuild)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The input-SHA lookup walks back to the last commit that
          # touched the build-affecting paths.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # One shared key for everything the perf jobs build; only this
          # job may write it, and only on a main push.
          shared-key: perf
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Resolve the prebuilt-binaries key
        id: key
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          # Same derivation `Perf (report)` looks up under — keep them in sync.
          read -ra paths <<< "$PERF_INPUT_PATHS"
          input_sha=$(git log -1 --format=%H HEAD -- "${paths[@]}")
          toolchain_hash=$(rustc -V | sha256sum | cut -c1-16)
          echo "input-sha=$input_sha" >> "$GITHUB_OUTPUT"
          echo "key=perf-bin-${RUNNER_OS}-${toolchain_hash}-${input_sha:-none}" >> "$GITHUB_OUTPUT"

      - name: Look up the prebuilt binaries
        id: prebuilt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/perf-bin
          key: ${{ steps.key.outputs.key }}
          # Presence check only — a hit means these exact inputs were
          # already built, so there is nothing to download or rebuild.
          lookup-only: true

      - name: Build the release binaries and the bench harness
        if: steps.prebuilt.outputs.cache-hit != 'true'
        env:
          STAGE: ${{ runner.temp }}/perf-bin
        run: |
          mkdir -p "$STAGE"
          cargo build --release --locked
          # `--no-run` compiles the harness without measuring; the JSON
          # stream carries the produced executable's path.
          cargo bench --locked --bench pipeline --no-run --message-format=json-render-diagnostics \
            > "$RUNNER_TEMP/bench-artifacts.json"

      - name: Stage the binaries and the provenance note
        if: steps.prebuilt.outputs.cache-hit != 'true'
        env:
          STAGE: ${{ runner.temp }}/perf-bin
          INPUT_SHA: ${{ steps.key.outputs.input-sha }}
        run: |
          bench_exe=$(jq -r \
            'select(.reason == "compiler-artifact" and .target.name == "pipeline" and .executable != null) | .executable' \
            "$RUNNER_TEMP/bench-artifacts.json" | tail -n 1)
          if [ -z "$bench_exe" ] || [ ! -x "$bench_exe" ]; then
            echo "could not locate the compiled pipeline bench harness"
            exit 1
          fi
          cp target/release/dbtl "$STAGE/dbtl"
          cp "$bench_exe" "$STAGE/pipeline"
          printf 'input_sha=%s\ntoolchain=%s\n' "$INPUT_SHA" "$(rustc -V)" > "$STAGE/META"
          ls -la "$STAGE"

      - name: Save the prebuilt binaries
        if: steps.prebuilt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/perf-bin
          key: ${{ steps.key.outputs.key }}

  # The ignored `perf_*` tests under a release build — a smoke budget per
  # workload, run against main daily so a pathological regression surfaces
  # even without a PR touching it.
  perf-nightly:
    name: Perf (nightly)
    # Adding the push trigger must not widen what runs this job — it stays
    # scheduled/dispatch-only, as before.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Read-only: `Perf (prebuild)` owns the shared key's writes.
          shared-key: perf
          save-if: false

      - name: Run perf tests (release)
        run: cargo test --release --workspace --locked -- --ignored perf_
