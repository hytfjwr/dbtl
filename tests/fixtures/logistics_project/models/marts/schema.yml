version: 2

models:
  - name: fct_shipments
    description: "Shipment facts with event rollup and order linkage"
    columns:
      - name: shipment_id
        tests:
          - unique
          - not_null
      - name: weight_kg
        description: "Total weight in kilograms"
        tests:
          - shipkit.no_negative_amounts
      - name: carrier_id
        tests:
          - relationships:
              to: ref('dim_carriers')
              field: carrier_id
  - name: fct_carrier_performance
    description: "{{ doc('carrier_perf_doc') }}"
  - name: dim_carriers
    description: "Carrier dimension"
    columns:
      - name: carrier_id
        tests:
          - unique
          - not_null
  - name: fct_region_gate
    description: "Regional shipment rollup — every region except emea"
    columns:
      - name: order_id
        tests:
          - unique: {config: {enabled: "{{ var('strict_event_check', false) }}"}}
          - not_null
      - name: customer_id
      - name: order_total
  - name: fct_bool_chain
    description: "Event rollup gated on alerts plus the us region"
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: shipment_id
      - name: event_type
      - name: occurred_at
  - name: fct_gate_report
    description: "Carrier rollup whose `enabled` lives in this schema entry"
    config:
      # A Jinja `enabled` at the MODEL's schema `config:` — the whole file
      # must still parse (descriptions, columns, tests) even though the
      # value is a string real dbt renders natively.
      enabled: "{{ var('alerts_enabled') }}"
    columns:
      - name: carrier_id
        tests:
          - unique
          - not_null
      - name: carrier_name
      - name: carrier_rating
unit_tests:
  - name: fct_shipments_legs_join
    model: fct_shipments
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_shipment_legs')
        rows:
          - {shipment_id: 1, carrier_id: 10, origin_id: 100, dest_id: 200, weight_kg: 5.0, status: 'delivered', event_count: 2, last_event_at: '2024-01-02'}
          - {shipment_id: 2, carrier_id: 11, origin_id: 101, dest_id: 201, weight_kg: 3.0, status: 'in_transit', event_count: 1, last_event_at: '2024-01-03'}
      - input: ref('int_order_shipments')
        rows:
          - {shipment_id: 1, order_id: 500, order_total: 42.5}
    expect:
      rows:
        - {shipment_id: 1, carrier_id: 10, origin_id: 100, dest_id: 200, weight_kg: 5.0, status: 'delivered', event_count: 2, last_event_at: '2024-01-02', order_id: 500, order_total: 42.5}
        - {shipment_id: 2, carrier_id: 11, origin_id: 101, dest_id: 201, weight_kg: 3.0, status: 'in_transit', event_count: 1, last_event_at: '2024-01-03', order_id: null, order_total: null}
  - name: dim_carriers_row_shape
    model: dim_carriers
    given:
      - input: ref('stg_carriers')
        rows:
          - {carrier_id: 10, carrier_name: 'Acme', mode: 'road', scac_code: 'ACME'}
    expect:
      format: csv
      rows: |
        carrier_id,carrier_name,mode,scac_code
        10,Acme,road,ACME
