name: Dogfood

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  action-self-test:
    name: Action self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Deliberately shallow: a depth-1 checkout lacks the pull
          # request's base commit, so this exercises the action's
          # base-fetch path on every pull request run.

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restores the shared release build — Dogfood E2E runs the same command on the same runner and saves it; this job never saves.
          shared-key: release
          save-if: false

      - name: Build dbtl (release)
        run: cargo build --release --locked

      - name: Put dbtl on PATH
        run: echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"

      - name: Run the action (passing check)
        id: passing
        uses: ./
        with:
          version: local
          project-dir: tests/fixtures/sample_project
          lint: 'true'
          fail-on: never
          sarif: 'true'
          comment: 'true'
          dry-run: 'true'

      - name: Verify the passing run
        env:
          EXIT_CODE: ${{ steps.passing.outputs.exit-code }}
          REPORT: ${{ steps.passing.outputs.report }}
          SARIF: ${{ steps.passing.outputs.sarif }}
        run: |
          [ "$EXIT_CODE" = "0" ] || { echo "::error::exit-code is $EXIT_CODE, want 0"; exit 1; }
          [ -f "$REPORT" ] || { echo "::error::report output points at a missing file: '$REPORT'"; exit 1; }
          head -n1 "$REPORT" | grep -qF '<!-- dbtl:report -->' || { echo "::error::the markdown report lacks the marker line"; exit 1; }
          [ -f "$SARIF" ] || { echo "::error::sarif output points at a missing file: '$SARIF'"; exit 1; }
          jq -e '.version == "2.1.0"' "$SARIF" >/dev/null || { echo "::error::the SARIF file is not version 2.1.0 JSON"; exit 1; }

      # The second run must fail the check — coverage-min 100 is above the
      # fixture's real coverage — and still write the report and SARIF.
      - name: Run the action (failing check)
        id: failing
        uses: ./
        continue-on-error: true
        with:
          version: local
          project-dir: tests/fixtures/sample_project
          args: --coverage-min 100
          sarif: 'true'
          comment: 'true'
          dry-run: 'true'

      - name: Verify the failing run still reported
        env:
          EXIT_CODE: ${{ steps.failing.outputs.exit-code }}
          REPORT: ${{ steps.failing.outputs.report }}
          SARIF: ${{ steps.failing.outputs.sarif }}
        run: |
          [ "$EXIT_CODE" = "1" ] || { echo "::error::exit-code is $EXIT_CODE, want 1"; exit 1; }
          [ -f "$REPORT" ] || { echo "::error::no report file on a failed check: '$REPORT'"; exit 1; }
          [ -f "$SARIF" ] || { echo "::error::no SARIF file on a failed check: '$SARIF'"; exit 1; }

      # The write-back steps are dry-runs — verify their printed plans
      # mechanically by re-running the scripts in dry-run mode.
      - name: Verify the dry-run comment plan
        env:
          DBTL_DRY_RUN: 'true'
          DBTL_REPORT: ${{ steps.passing.outputs.report }}
          DBTL_PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
        run: |
          out="$(bash "$GITHUB_WORKSPACE/action/comment.sh")"
          echo "$out"
          echo "$out" | grep -qF 'GET /repos/' || { echo "::error::the dry-run plan does not describe the existing-comment lookup"; exit 1; }
          echo "$out" | grep -qF 'PATCH /repos/' || { echo "::error::the dry-run plan does not describe the comment update"; exit 1; }
          echo "$out" | grep -qF 'POST /repos/' || { echo "::error::the dry-run plan does not describe the comment create"; exit 1; }

      - name: Verify the dry-run SARIF plan
        env:
          DBTL_SARIF_FILE: ${{ steps.passing.outputs.sarif }}
        run: |
          out="$(bash "$GITHUB_WORKSPACE/action/sarif_dry_run.sh")"
          echo "$out"
          echo "$out" | grep -qF 'codeql-action/upload-sarif' || { echo "::error::the dry-run plan does not describe the SARIF upload"; exit 1; }

  dogfood-e2e:
    name: Dogfood E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Shared release build — saved on pushes to main only; PR runs and the other release builders restore it.
          shared-key: release
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build dbtl (release)
        run: cargo build --release --locked

      - name: Put dbtl on PATH
        run: echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"

      # The committed jaffle_finance fixture trips the error-severity lint
      # rules that still gate by default (missing_primary_key_tests), so
      # `check --lint` is a gate failure (exit 1) — the pinned expectation,
      # verified against the release binary. Every report format is
      # exercised on the same run and kept for inspection.
      - name: Run the full check report
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dogfood"
          mkdir -p "$out"
          set +e
          dbtl check --manifest tests/fixtures/manifest.json --lint \
            --format github \
            --report markdown:"$out/report.md" \
            --report sarif:"$out/report.sarif" \
            --report junit:"$out/report.xml" \
            --report json:"$out/report.json" \
            --step-summary \
            >"$out/annotations.txt" 2>"$out/check-stderr.txt"
          code=$?
          set -e
          cat "$out/check-stderr.txt"
          if [ "$code" -ne 1 ]; then
            echo "::error::'dbtl check --lint' exited $code — expected 1 (gate failure on the fixture's error-severity findings)"
            exit 1
          fi
          errors=$(grep -c '^::error ' "$out/annotations.txt" || true)
          if [ "$errors" -lt 1 ]; then
            echo "::error::the github-format report carried no ::error annotations on a failing run"
            exit 1
          fi
          echo "check --lint: exit 1 with $errors '::error file=…,line=…,title=…::' annotations, as expected"
          head -n 3 "$out/annotations.txt"

      # The remaining exit-code classes, one invocation each: 0 = pass
      # (--fail-on never downgrades every finding to a report-only WARN),
      # 2 = usage error (unknown rule id), 3 = input error (missing
      # manifest). Exit 1 is pinned by the real run above.
      - name: Pin the exit-code ladder
        run: |
          set -euo pipefail
          expect() {
            local want="$1"; shift
            set +e
            "$@" >/dev/null 2>&1
            local got=$?
            set -e
            if [ "$got" -ne "$want" ]; then
              echo "::error::$* exited $got — expected $want"
              exit 1
            fi
            echo "exit $got: $*"
          }
          expect 0 dbtl check --manifest tests/fixtures/manifest.json --lint --fail-on never --quiet
          expect 2 dbtl check --manifest tests/fixtures/manifest.json --lint --rules not_a_rule --quiet
          expect 3 dbtl check --manifest tests/fixtures/does_not_exist.json --lint --quiet

      # The original rule ids must all appear in the listing — the ids are
      # a compatibility contract (their severities were re-tiered; the ids
      # did not change) — while the removed undocumented_public_models id
      # must never be listed.
      - name: Verify lint --list-rules
        run: |
          set -euo pipefail
          dbtl lint --list-rules | tee "$RUNNER_TEMP/dogfood/rules.txt"
          for id in \
            direct_join_to_source multiple_sources_joined source_fanout \
            model_fanout root_models rejoining_upstream \
            marts_depend_on_source missing_primary_key_tests \
            public_models_without_contract undocumented_models \
            naming_conventions layer_violation; do
            grep -qw "$id" "$RUNNER_TEMP/dogfood/rules.txt" || {
              echo "::error::'lint --list-rules' is missing rule id '$id'"
              exit 1
            }
          done
          if grep -qw "undocumented_public_models" "$RUNNER_TEMP/dogfood/rules.txt"; then
            echo "::error::'lint --list-rules' still lists removed rule 'undocumented_public_models'"
            exit 1
          fi
          echo "lint --list-rules: exit 0, the original ids listed, the removed id absent"

      - name: Exercise docs generation and --check
        run: |
          set -euo pipefail
          docs="$RUNNER_TEMP/dogfood/docs"
          dbtl docs --manifest tests/fixtures/manifest.json --out "$docs" --quiet
          dbtl docs --manifest tests/fixtures/manifest.json --out "$docs" --check --quiet
          echo "docs --check on freshly generated output: exit 0"
          printf '\n' >> "$docs/README.md"
          set +e
          dbtl docs --manifest tests/fixtures/manifest.json --out "$docs" --check
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::'docs --check' on a doctored page exited $code — expected 1"
            exit 1
          fi
          echo "docs --check on a doctored page: exit 1 (drift is a gate failure)"

      # `dbtl ls` selectors against the frozen fixture — a bare name and
      # a staging-layer glob must resolve to the fixture's known models.
      - name: Exercise dbtl ls
        run: |
          set -euo pipefail
          dbtl ls pos_txn --manifest tests/fixtures/manifest.json | tee "$RUNNER_TEMP/dogfood/ls.txt"
          grep -qx 'pos_txn' "$RUNNER_TEMP/dogfood/ls.txt" || {
            echo "::error::'dbtl ls pos_txn' did not list pos_txn"
            exit 1
          }
          dbtl ls 'stg_*' --manifest tests/fixtures/manifest.json | tee "$RUNNER_TEMP/dogfood/ls-stg.txt"
          for name in stg_finance__budgets stg_payment__suppliers; do
            grep -qx "$name" "$RUNNER_TEMP/dogfood/ls-stg.txt" || {
              echo "::error::'dbtl ls stg_*' did not list $name"
              exit 1
            }
          done
          echo "dbtl ls: exit 0, frozen fixture names resolve through the selector"

      # `dbtl impact --diff git:<rev>` materializes the baseline read-only
      # via git ls-tree/cat-file — assert the working tree is untouched on
      # both sides of the run.
      - name: Exercise the git-revision baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::the working tree is dirty before the git-baseline run"
            exit 1
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          set +e
          dbtl impact --project tests/fixtures/sample_project --diff "git:$BASE_SHA" \
            >"$RUNNER_TEMP/dogfood/impact.md" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/dogfood/impact.md"
          if [ "$code" -ne 0 ]; then
            echo "::error::'dbtl impact --diff git:<base>' exited $code — expected 0"
            exit 1
          fi
          grep -qF "git:$BASE_SHA" "$RUNNER_TEMP/dogfood/impact.md" || {
            echo "::error::the impact report does not name the git baseline"
            exit 1
          }
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::'--diff git:' changed the working tree — it must stay read-only"
            exit 1
          fi
          echo "impact --diff git:<base>: exit 0, working tree untouched"

      - name: Validate the report structures
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dogfood"
          jq -e '.version == "2.1.0"' "$out/report.sarif" >/dev/null || {
            echo "::error::the SARIF report is not version 2.1.0"
            exit 1
          }
          jq -e '.runs[0].tool.driver.rules | length > 0' "$out/report.sarif" >/dev/null || {
            echo "::error::the SARIF report declares no tool rules"
            exit 1
          }
          jq -e '([.runs[0].results[].ruleId] - [.runs[0].tool.driver.rules[].id]) | length == 0' \
            "$out/report.sarif" >/dev/null || {
            echo "::error::SARIF results reference rules missing from tool.driver.rules"
            exit 1
          }
          counted=$(jq '[.gates[].findings[]? | select(.baselined | not)] | length' "$out/report.json")
          sarif_results=$(jq '.runs[0].results | length' "$out/report.sarif")
          if [ "$counted" -lt 1 ]; then
            echo "::error::the JSON report carried no counted findings — the SARIF count check would pass vacuously"
            exit 1
          fi
          if [ "$counted" -ne "$sarif_results" ]; then
            echo "::error::SARIF carried $sarif_results results for $counted counted findings — baselined findings must never reach SARIF"
            exit 1
          fi
          jq -e '.summary.baselined == 0' "$out/report.json" >/dev/null || {
            echo "::error::the fixture has no baseline file, yet findings were marked baselined"
            exit 1
          }
          jq -e '.schema == "dbtl.report/v1"' "$out/report.json" >/dev/null || {
            echo "::error::the JSON report schema is not dbtl.report/v1"
            exit 1
          }
          jq -e '.gates | length >= 1' "$out/report.json" >/dev/null || {
            echo "::error::the JSON report has no gates — the JUnit testcase check would pass vacuously"
            exit 1
          }
          gates=$(jq '.gates | length' "$out/report.json")
          failed=$(jq '[.gates[] | select(.status == "fail")] | length' "$out/report.json")
          if [ "$failed" -lt 1 ]; then
            echo "::error::no gate failed on the fixture — the JUnit failure-count check would pass vacuously"
            exit 1
          fi
          JUNIT_FILE="$out/report.xml" EXPECTED_GATES="$gates" EXPECTED_FAILURES="$failed" \
            python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET

          def die(msg):
              print(f"::error::{msg}", file=sys.stderr)
              sys.exit(1)

          root = ET.parse(os.environ["JUNIT_FILE"]).getroot()
          if root.tag != "testsuites":
              die(f"JUnit root is <{root.tag}>, expected <testsuites>")
          cases = root.findall(".//testcase")
          want_cases = int(os.environ["EXPECTED_GATES"])
          if len(cases) != want_cases:
              die(f"JUnit has {len(cases)} testcases, expected one per gate ({want_cases})")
          failures = [c for c in cases if c.find("failure") is not None]
          want_failures = int(os.environ["EXPECTED_FAILURES"])
          if len(failures) != want_failures:
              die(f"JUnit has {len(failures)} failing testcases, expected {want_failures}")
          print(f"JUnit: {len(cases)} testcases, {len(failures)} failures — one per gate")
          PY
          echo "report structures OK: sarif=$sarif_results results, json=dbtl.report/v1, junit=$gates testcases/$failed failures"

      # Reports stay available even when an assertion above fails.
      - name: Upload the dogfood reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dogfood-e2e-reports
          path: |
            ${{ runner.temp }}/dogfood/report.md
            ${{ runner.temp }}/dogfood/report.sarif
            ${{ runner.temp }}/dogfood/report.xml
            ${{ runner.temp }}/dogfood/report.json
            ${{ runner.temp }}/dogfood/impact.md
          if-no-files-found: warn
