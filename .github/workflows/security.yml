name: Security

on:
  push:
    branches: [main]
  pull_request:
  # New RustSec advisories appear without any commit; scan the lockfile daily
  # so they surface even while the tree is unchanged.
  schedule:
    - cron: "23 21 * * *"
  workflow_dispatch:

permissions: {}

env:
  # One pin for every job that runs shellcheck — the lint job and
  # jactionlint, which shells out to `shellcheck` for workflow `run:` bodies.
  SHELLCHECK_VERSION: v0.11.0
  # SHA-256 of shellcheck-v0.11.0.linux.x86_64.tar.xz. Upstream publishes no
  # checksums file, so the digest is pinned here and verified on install.
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Kept out of `checks`: its SARIF upload needs `security-events: write` and
  # `actions: read`, which would widen the token every other check (pinact
  # included) runs with.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    permissions:
      contents: read
      # zizmor-action uploads SARIF results to the Security tab.
      security-events: write
      # Required by codeql-action/upload-sarif inside zizmor-action.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version:` input: the action resolves `latest` from a hash-locked
      # requirements file in its own tree, so the SHA pin also pins zizmor
      # (1.32.0 at v0.8.1) and a Dependabot update moves both.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Fork PRs get a read-only token (no security-events: write), so the
          # SARIF upload would always fail there; fall back to plain output.
          advanced-security: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  # The four small, independent checks share one job: each is a few seconds of
  # work, so separate jobs mostly paid runner start-up and checkout. The
  # tools install in order, the `run:` checks run as one parallel group, and
  # the workflow lint (an action) runs after it.
  checks:
    name: Security checks
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PINACT_VERSION: v4.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore cached pinact
        id: cache-pinact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/pinact
          key: pinact-${{ runner.os }}-${{ env.PINACT_VERSION }}

      # Built from source so the Go module checksum database verifies the
      # binary's provenance (no curl|bash, no unpinned third-party action).
      - name: Install pinact
        if: steps.cache-pinact.outputs.cache-hit != 'true'
        run: go install "github.com/suzuki-shunsuke/pinact/v4/cmd/pinact@${PINACT_VERSION}"

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # jactionlint lints workflow `run:` bodies through the `shellcheck` it
      # finds on PATH, and the script lint runs it directly — put the pinned
      # one first so both use the same version.
      - name: Restore cached shellcheck
        id: cache-shellcheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dbtl-shellcheck
          key: shellcheck-${{ runner.os }}-${{ env.SHELLCHECK_VERSION }}

      - name: Install shellcheck
        if: steps.cache-shellcheck.outputs.cache-hit != 'true'
        run: bash .github/scripts/install-shellcheck.sh "$HOME/.cache/dbtl-shellcheck"

      - name: Add shellcheck to PATH
        run: echo "$HOME/.cache/dbtl-shellcheck" >> "$GITHUB_PATH"

      # Advisory state moves independently of the code, so bans/licenses/
      # sources stay on push + pull_request only (never a manual run);
      # advisories run on every trigger in their own job below.
      - name: Install Rust toolchain
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install cargo-deny
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      # Only `run:` steps go in the group — a `uses:` step run in parallel or
      # in the background can race with its siblings in the runner (shared
      # action downloads, composite-action state, the event payload file).
      # The group joins before the job ends; a failing check lets the others
      # finish, then fails the job.
      - parallel:
          - name: Lint shell scripts
            run: bash .github/scripts/run-shellcheck.sh

          # --verify also checks each pinned SHA matches its trailing version
          # comment (catches a lying `# vX.Y.Z` next to a malicious SHA).
          - name: Verify all actions are SHA-pinned
            run: pinact run --check --verify
            env:
              GITHUB_TOKEN: ${{ github.token }}

          - name: Check bans, licenses, and sources
            if: github.event_name == 'push' || github.event_name == 'pull_request'
            run: cargo deny check bans licenses sources

      # The jactionlint action is a `uses:` step, so it runs after the group
      # rather than inside it; `!cancelled()` keeps its findings coming even
      # when a check in the group failed. The SHA pin also pins the release
      # the action downloads, and findings land as pull request annotations.
      - name: Lint workflows
        if: ${{ !cancelled() }}
        uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0

  # Kept out of `checks` and out of the aggregate: report-only, and it runs
  # on the daily schedule too, which `checks` skips.
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - name: Check security advisories
        run: cargo deny check advisories

  # The single required check for this workflow: fails when any needed job
  # failed or was cancelled. `advisories` stays out of `needs` — new
  # advisories appear without any commit and must not gate merges. On a
  # schedule or dispatch run the trigger-scoped skips simply pass.
  security-result:
    name: Security result
    needs:
      - zizmor
      - checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Aggregate the required checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash .github/scripts/aggregate-results.sh
