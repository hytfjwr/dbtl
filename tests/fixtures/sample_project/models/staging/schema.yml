version: 2

sources:
  - name: raw
    database: analytics
    schema: raw_data
    tables:
      - name: orders
        description: "Raw orders from the app"
        columns:
          - name: id
            data_type: integer
            description: "Order id"
            tests:
              - not_null
      - name: customers
        description: "Raw customers"

models:
  - name: stg_schema_disabled
    config:
      enabled: false
  - name: stg_orders
    description: "Staged orders"
    columns:
      - name: id
        data_type: integer
        description: "Order id"
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ["new", "shipped"]
