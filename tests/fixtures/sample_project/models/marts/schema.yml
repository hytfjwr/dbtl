version: 2

models:
  - name: fct_orders
    # A docs-block ref (multiline block, models/marts/docs.md): dbt renders it
    # into the description; the source loader must expand it identically.
    description: "{{ doc('order_facts_doc') }}"
    config:
      meta:
        # The in-file `config(meta=…)` `owner` wins over this per key; `zone`
        # survives (schema level beats the project tree, loses to the file).
        owner: schema-writer
        zone: z1
    columns:
      - name: id
        data_tests:
          - not_null
      - name: status
      - name: country_code
      - name: country
  - name: dim_customers
    description: "Customer dimension"
    config:
      # The in-file config (incremental) must win over this schema value.
      materialized: table
      meta:
        owner: bob

exposures:
  - name: orders_dashboard
    type: dashboard
    url: https://bi.example.com/dashboards/42
    # Mixed text + doc(): the ref expands inside the surrounding sentence.
    description: "Weekly orders overview for finance. {{ doc('finance_note_doc') }}"
    owner:
      name: Finance Team
      email: finance@example.com
    depends_on:
      - ref('fct_orders')
      - ref('agg_country_orders')
  # Minimal shape: owner name only, no url/description; a non-ref dep that
  # must resolve through source().
  - name: churn_notebook
    type: notebook
    owner:
      name: Analytics
    depends_on:
      - ref('dim_customers')
      - source('raw', 'customers')
