version: 2

sources:
  - name: raw
    database: analytics
    schema: raw_data
    tables:
      - name: orders
        # Whitespace-controlled docs block ({%- docs -%}).
        description: "{{ doc('raw_orders_doc') }}"
        columns:
          - name: id
            data_type: integer
            # 2-arg doc() naming the project itself resolves locally.
            description: "{{ doc('sample', 'primary_key_doc') }}"
            tests:
              - not_null
      - name: customers
        description: "Raw customers"

models:
  - name: stg_schema_disabled
    config:
      enabled: false
  - name: stg_orders
    description: "Staged orders"
    columns:
      - name: id
        data_type: integer
        description: "{{ doc('primary_key_doc') }}"
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ["new", "shipped"]
