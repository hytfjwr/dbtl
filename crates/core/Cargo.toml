[package]
name = "dbtl-core"
description = "dbtl's dbt domain model — manifest/source parsing, the Dag, diff, and Mermaid export core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
# `.dbtl.yml` is dbtl's OWN config file — serde_norway like the user-level
# config (dbt's own YAML files go through yaml-rust2, see source.rs).
serde_norway.workspace = true
sqlparser.workspace = true
yaml-rust2.workspace = true

[dev-dependencies]
# Temp target/compiled trees for the staleness unit tests (crates/core/src/compiled.rs).
tempfile = "3"
