version: 2

seeds:
  - name: shipments
    description: "Raw shipment records exported from the TMS"
    columns:
      - name: shipment_id
        tests:
          - unique
          - not_null
      - name: weight_kg
  - name: carriers
    description: "Carrier master data"
    # Top-level `tags:` ignored (verified on 1.12.6); `config.tags:` lands
    # after the `seeds:` tree's `+tags` on the wire.
    tags: [carr_ignored]
    config:
      tags: [carr_yml]
