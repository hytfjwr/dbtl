name: Release

# Three entry points, one pipeline:
#   - a merged release/vX.Y.Z PR (opened by bump.yml): the normal flow. Reads
#     the version from Cargo.toml on the merge commit, creates the tag, then
#     builds and releases.
#   - workflow_dispatch ("Run workflow" button): same, from the chosen ref.
#     Also the retry path — if the tag exists but no release was published
#     (an earlier run died mid-way), it resumes instead of refusing.
#   - tag push (v*): escape hatch. Fails fast if the tag does not match
#     Cargo.toml's version, so a tag cut without a version bump can never
#     ship a binary that reports the wrong --version.
on:
  push:
    tags: ["v*"]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    name: Resolve release tag
    # For pull_request events, only merged release/* PRs start a release.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Create the release tag.
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a merged PR, read Cargo.toml from the merge commit on main.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}
          persist-credentials: false

      - name: Resolve tag from Cargo.toml
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          tag="v${version}"
          sha="${MERGE_SHA:-$GITHUB_SHA}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version. Bump Cargo.toml (and Cargo.lock) first, then re-tag."
              exit 1
            fi
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            # Tag exists. Refuse only if its release is already published;
            # otherwise an earlier run died mid-way — resume it.
            if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
              echo "::error::Tag $tag already exists and its release is published. Bump the version (run the 'Open release PR' workflow) before releasing."
              exit 1
            fi
            echo "Tag $tag exists without a published release — resuming."
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" -f sha="$sha"
            echo "Created tag $tag at $sha"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Build + packaging are reusable: release-dry-run.yml calls the same
  # workflow so the dry run exercises the exact steps a real release takes.
  build:
    needs: prepare
    uses: ./.github/workflows/release-build.yml
    # Grants the called jobs their requested ceiling — the called workflow's
    # jobs each request `contents: read` (checkout + artifact upload only).
    permissions:
      contents: read
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      ref: ${{ needs.prepare.outputs.tag }}

  # Signing permissions live only in this job — the build jobs keep their
  # read-only token, and a caller that cannot mint attestations (a dry run)
  # never reaches this job at all.
  attest:
    name: Attest release artifacts
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the release asset bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/dbtl-*.tar.gz
            dist/dbtl-*.zip
            dist/dbtl-*.cdx.json
            dist/checksums.txt

      # The SBOM attestation binds the CycloneDX document to the archives it
      # describes — checksums.txt is the same subject list the release ships.
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          sbom-path: "dist/dbtl-${{ needs.prepare.outputs.tag }}.cdx.json"
          subject-checksums: dist/checksums.txt

  release:
    name: Create release
    needs: [prepare, build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # gh release create / upload.
      contents: write
    steps:
      - name: Download the release asset bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Idempotent: a release may already exist (e.g. drafted from the UI,
          # which also pushes the tag) — then just attach the assets to it.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi

  homebrew:
    name: Update Homebrew tap
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # gh release download (the tap push uses TAP_GITHUB_TOKEN instead).
      contents: read
    env:
      TAP_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
      TAP_REPO: hytfjwr/homebrew-tap
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::RELEASE_GITHUB_TOKEN is not set — skipping the Homebrew tap update. Add a fine-grained PAT with contents:write on ${TAP_REPO} to enable it (see RELEASING.md)."
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt

      - name: Update formula
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            exit 0
          fi
          sha_for() {
            awk -v f="dbtl-${TAG}-$1.tar.gz" '$2 == f { print $1 }' checksums.txt
          }
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > dbtl.rb <<EOF
          class Dbtl < Formula
            desc "Terminal UI for exploring dbt model lineage as ASCII art"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/dbtl-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha_for aarch64-apple-darwin)"
              end
              on_intel do
                url "${base}/dbtl-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha_for x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/dbtl-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha_for aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "${base}/dbtl-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha_for x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "dbtl"
              bash_completion.install "completions/dbtl.bash" => "dbtl"
              zsh_completion.install "completions/_dbtl"
              fish_completion.install "completions/dbtl.fish"
              man1.install "man/dbtl.1"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/dbtl --version")
            end
          end
          EOF
          # Every sha256 line must have a value; an empty one means a missing asset.
          if grep -q 'sha256 ""' dbtl.rb; then
            echo "::error::Missing checksum for one of the targets"
            exit 1
          fi
          GH_TOKEN="$TAP_TOKEN" gh api "repos/${TAP_REPO}/contents/Formula/dbtl.rb" --jq .sha > old_sha 2>/dev/null || true
          args=(-f message="dbtl ${TAG}" -f content="$(base64 -w0 dbtl.rb)")
          if [ -s old_sha ]; then
            args+=(-f sha="$(cat old_sha)")
          fi
          GH_TOKEN="$TAP_TOKEN" gh api -X PUT "repos/${TAP_REPO}/contents/Formula/dbtl.rb" "${args[@]}"

  # Renders the demo tape at the release tag and attaches demo.gif to the
  # release — a convenience asset, not a shipped artifact: nothing depends
  # on this job (homebrew fans out from `release`, not from here), the GIF
  # is not part of checksums.txt or the attestations, and a render or
  # attach failure leaves the release and the tap update untouched. To
  # re-attach by hand, run the Demo workflow with a release-tag.
  demo:
    name: Demo GIF
    needs: [prepare, release]
    uses: ./.github/workflows/demo.yml
    permissions:
      # Ceiling for the called jobs — the render only reads, the attach
      # writes the release. The grant must cover both: GitHub validates a
      # called workflow's declared permissions at startup.
      contents: write
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      release-tag: ${{ needs.prepare.outputs.tag }}

  # Publishes the docs site as of the release tag. The release is created
  # with GITHUB_TOKEN, so a `release: published` trigger would never fire;
  # this job starts the Docs site workflow explicitly instead, from main
  # (GitHub Pages deploys only from main) with the tag as the content to
  # build. Like `demo`, nothing depends on this job, so a failure here leaves
  # the release and the tap update untouched. To publish by hand, run the
  # Docs site workflow on main.
  docs:
    name: Docs site
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # gh workflow run: dispatching a workflow needs actions: write.
      actions: write
    steps:
      - name: Start the Docs site workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh workflow run docs-site.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"
