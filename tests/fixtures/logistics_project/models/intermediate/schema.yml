version: 2

models:
  - name: int_rate_cards
    description: "Rate-card rows staged through the macro feed"
    columns:
      - name: feed_id
        description: "Feed row id"
        tests:
          - unique
          - not_null
  # The `target.name == 'prod'` arm refs stg_prod_orders — real dbt never
  # renders it under `dev`, so the manifest's depends_on records stg_orders
  # alone while the source loader keeps both edges.
  - name: int_order_split
    description: "Order rows re-staged by environment branch"
    columns:
      - name: order_id
        description: "Order identifier"
        tests:
          - unique
          - not_null
