version: 2
updates:
  # Rust dependencies (Cargo.toml / Cargo.lock)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # Wait 5 days after a release before proposing it (supply-chain cooldown:
    # lets compromised releases get yanked before they ever reach a PR).
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions (keeps SHA-pinned actions up to date)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # Wait 5 days after a release before proposing it (supply-chain cooldown:
    # lets compromised releases get yanked before they ever reach a PR).
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docs site dependencies (site/package.json / site/pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # The site pins only versions that were public for at least 14 days, so
    # updates wait the same time before they are proposed.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
